# MautoDesk — local development stack.
#
# Mirrors production dependencies with local equivalents:
#   DigitalOcean Managed PostgreSQL  → postgres:16
#   DigitalOcean Managed Valkey      → valkey (Redis-compatible)
#   Cloudflare R2                    → MinIO (S3 API, same client code)
#   Postmark / SES                   → Mailpit (catches mail, never sends)
#   ClamAV                           → the same clamd the workers use in production
#
# Nothing here is production configuration. Credentials are deliberately weak
# and deliberately committed: they only ever work against localhost. Real
# secrets never enter this repository.
#
# Host ports are overridable. Developers commonly run more than one project's
# database at once, and a hard-coded 5432 turns "clone and run" into "stop the
# other thing first". Set POSTGRES_PORT etc. in .env to shift them.

name: mautodesk

services:
  postgres:
    image: postgres:16-alpine
    container_name: mautodesk-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: mautodesk
      # Deterministic collation so index behaviour matches CI and production.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mautodesk']
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    container_name: mautodesk-valkey
    command: ['valkey-server', '--save', '60', '1', '--appendonly', 'no']
    ports:
      - '${VALKEY_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage standing in for Cloudflare R2. The application
  # talks to both through the same AWS SDK client, so switching is configuration.
  minio:
    image: minio/minio:latest
    container_name: mautodesk-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: mautodesk
      MINIO_ROOT_PASSWORD: devpassword
    ports:
      - '${MINIO_PORT:-9000}:9000'   # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001'   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the four buckets from ADR-0005 with the right access posture.
  minio-init:
    image: minio/mc:latest
    container_name: mautodesk-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mautodesk devpassword;
      mc mb --ignore-existing local/mautodesk-uploads;
      mc mb --ignore-existing local/mautodesk-media;
      mc mb --ignore-existing local/mautodesk-docs;
      mc mb --ignore-existing local/mautodesk-vault;
      mc version enable local/mautodesk-docs;
      mc version enable local/mautodesk-vault;
      mc ilm rule add --expire-days 1 local/mautodesk-uploads || true;
      echo 'Buckets ready. uploads=quarantine, media=CDN, docs=private, vault=immutable.';
      "

  # Virus scanning for the upload pipeline. Slow to start (it loads signature
  # databases); the API stays healthy without it but uploads stay quarantined.
  clamav:
    image: clamav/clamav:stable
    container_name: mautodesk-clamav
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Catches all outbound mail. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mautodesk-mailpit
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'   # SMTP
      - '${MAILPIT_UI_PORT:-8025}:8025'   # web UI
    environment:
      MP_MAX_MESSAGES: 500

  # Applies db/migrations in filename order, then verifies RLS coverage and runs
  # the cross-tenant isolation probe. Exits non-zero if either fails, so a broken
  # schema surfaces at `docker compose up`, not in a code review.
  migrate:
    image: postgres:16-alpine
    container_name: mautodesk-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
    environment:
      PGPASSWORD: devpw
    entrypoint: >
      /bin/sh -c "
      set -e;
      PSQL='psql -h postgres -U postgres -d mautodesk -v ON_ERROR_STOP=1 -q';
      $$PSQL -c 'create table if not exists public.schema_version (filename text primary key, applied_at timestamptz not null default now())';
      for f in /db/migrations/V*.sql; do
        name=$$(basename \"$$f\");
        applied=$$(psql -h postgres -U postgres -d mautodesk -t -A -c \"select count(*) from public.schema_version where filename = '$$name'\");
        if [ \"$$applied\" = \"1\" ]; then echo \"skipping $$name (already applied)\"; continue; fi;
        echo \"applying $$name\";
        $$PSQL -f \"$$f\";
        $$PSQL -c \"insert into public.schema_version (filename) values ('$$name')\";
      done;
      echo '--- RLS coverage ---';
      gaps=$$(psql -h postgres -U postgres -d mautodesk -t -A -c 'select count(*) from app.rls_coverage_gaps();');
      if [ \"$$gaps\" != \"0\" ]; then
        echo \"FAIL: $$gaps RLS coverage gap(s)\";
        psql -h postgres -U postgres -d mautodesk -c 'select * from app.rls_coverage_gaps();';
        exit 1;
      fi;
      echo 'RLS coverage OK';
      psql -h postgres -U postgres -d mautodesk -v ON_ERROR_STOP=1 -f /db/tests/isolation_probe.sql;
      "

volumes:
  postgres-data:
  minio-data:
